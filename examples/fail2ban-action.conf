# SSH Sentinel fail2ban bridge (issue #19).
#
# Option A (push, same host): central calls fail2ban-client directly.
# Set BAN_ENABLED=1 and BAN_JAIL=sshd on central. Needs the fail2ban
# socket visible to central (host install or shared volume).
# No config file needed for this path.
#
# Option B (pull, any host): fail2ban reads the central ban list.
# Central writes DATA_DIR/banlist.txt on every ban change.
# This action polls it. Use it when fail2ban runs on members.
#
# Install:
# 1. Copy this file to /etc/fail2ban/action.d/sentinel.conf
# 2. Add a jail that bans IPs from the list (example below).
# 3. Reload fail2ban.

[Definition]
# Poll central every 60s. Use a login user (local mode) or tailnet limit.
# Replace URL and credentials for your setup.
actionstart =
actionstop =
actioncheck =
actionban = curl -s -u admin:<password> http://central:8079/api/banlist
actionunban =

# Example jail (append to jail.local):
# [sentinel]
# enabled = true
# filter = sshd
# action = sentinel
#          iptables-multiport[name=ssh, port="ssh"]
# bantime = 86400
# findtime = 600
# maxretry = 20
