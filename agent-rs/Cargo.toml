[package]
name = "ssh-sentinel-agent"
version = "0.1.0"
edition = "2021"
description = "SSH Sentinel log shipper in Rust. Same protocol as agent-rs."
license = "MIT"

[[bin]]
name = "ssh-sentinel-agent"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
hostname = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
