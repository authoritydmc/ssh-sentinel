name: Release (tag -> GitHub Release)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          FILE="CHANGELOG.md"
          NOTES="$(awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; print; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' "$FILE")"
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG (no CHANGELOG entry found)."
          fi
          {
            echo "$NOTES"
            echo ""
            echo "---"
            echo "Images: \`rajlabs/ssh-sentinel:$VER\` (+ \`ghcr.io/${{ github.repository }}:$VER\`) and \`:latest\`."
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
