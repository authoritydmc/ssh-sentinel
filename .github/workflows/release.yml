name: Release (tag -> GitHub Release)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          FILE="CHANGELOG.md"
          NOTES="$(awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; print; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' "$FILE")"
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG (no CHANGELOG entry found)."
          fi
          {
            echo "$NOTES"
            echo ""
            echo "---"
            echo "Images: \`rajlabs/ssh-sentinel:$VER\` (+ \`ghcr.io/${{ github.repository }}:$VER\`) and \`:latest\`."
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md

  native-bin:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p ssh-sentinel -p ssh-sentinel-agent
      - shell: bash
        run: cp target/${{ matrix.target }}/release/ssh-sentinel${{ matrix.exe }} ./ssh-sentinel-${{ matrix.target }}${{ matrix.exe }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/ssh-sentinel-agent${{ matrix.exe }} ./ssh-sentinel-agent-${{ matrix.target }}${{ matrix.exe }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            ./ssh-sentinel-${{ matrix.target }}${{ matrix.exe }} \
            ./ssh-sentinel-agent-${{ matrix.target }}${{ matrix.exe }} --clobber
