name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo publish --dry-run -p ssh-sentinel
      - run: cargo publish --dry-run -p ssh-sentinel-agent
      - run: test -s demo/auth.log.sample

  rust-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p ssh-sentinel-agent
      - run: ls -l target/release/ssh-sentinel-agent
      - run: cargo build --release --target x86_64-unknown-linux-musl -p ssh-sentinel-agent
      - run: ls -l target/x86_64-unknown-linux-musl/release/ssh-sentinel-agent
      - run: cargo build -p ssh-sentinel
      - run: chmod +x scripts/smoke-agent.sh && AGENT_BIN=target/release/ssh-sentinel-agent CENTRAL_BIN=target/debug/ssh-sentinel bash scripts/smoke-agent.sh

  smoke-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p ssh-sentinel
      - run: chmod +x scripts/smoke-central.sh && RSBIN=target/debug/ssh-sentinel bash scripts/smoke-central.sh
