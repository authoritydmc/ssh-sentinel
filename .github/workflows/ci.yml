name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m compileall -q backend/server.py agent/agent.py demo/gen_auth_log.py
      - run: python3 demo/gen_auth_log.py && test -s demo/auth.log.sample
      - run: python3 scripts/selftest_oidc.py

  rust-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path agent-rs/Cargo.toml
      - run: ls -l agent-rs/target/release/ssh-sentinel-agent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: chmod +x scripts/parity-agent.sh && AGENT_BIN=agent-rs/target/release/ssh-sentinel-agent bash scripts/parity-agent.sh

  parity-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --manifest-path central-rs/Cargo.toml
      - run: chmod +x scripts/parity-central.sh && RSBIN=central-rs/target/debug/ssh-sentinel bash scripts/parity-central.sh
