name: ssh-sentinel

services:
  central:
    build: .
    image: rajlabs/ssh-sentinel:latest
    container_name: ssh-sentinel
    restart: unless-stopped
    ports:
      - "${PORT:-8079}:8079"
    environment:
      HOST_ID: ${HOST_ID:-central}
      SELF_PUBLIC_IPS: ${SELF_PUBLIC_IPS:-}
      AUTH_LOG: ${AUTH_LOG:-/var/log/auth.log}
      SHIP_FILTER: ${SHIP_FILTER:-sshd-only}
      PRIVACY_MODE: ${PRIVACY_MODE:-balanced}
      TRUSTED_IPS: ${TRUSTED_IPS:-}
      TRUSTED_USERS: ${TRUSTED_USERS:-}
      MAX_LINES_PER_HOST: ${MAX_LINES_PER_HOST:-60000}
      # Login: local (default, fail-closed) | forward/oidc (Authentik+Traefik) | none (private net only).
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASS_HASH: ${AUTH_PASS_HASH:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_ALLOWED_USERS: ${AUTH_ALLOWED_USERS:-}
      ABUSERS_RPM: ${ABUSERS_RPM:-60}
      # Optional in-repo TLS 1.3: mount cert/key and set both.
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      DATA_DIR: /srv/data
    volumes:
      - sentinel_data:/srv/data
      # Production: live host log. Demo profile overrides with the sample file.
      - /var/log/auth.log:/var/log/auth.log:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8079/healthz >/dev/null || python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8079/healthz').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Demo mode: same image, sample log, no host log mount.
  #   docker compose --profile demo up --build
  demo:
    profiles: ["demo"]
    build: .
    image: rajlabs/ssh-sentinel:latest
    container_name: ssh-sentinel-demo
    ports:
      - "${DEMO_PORT:-8081}:8079"
    environment:
      HOST_ID: demo-fleet
      AUTH_LOG: /srv/demo/auth.log.sample
      DATA_DIR: /tmp/sentinel-demo
      AUTH_MODE: none
    volumes:
      - ./demo/auth.log.sample:/srv/demo/auth.log.sample:ro

volumes:
  sentinel_data:
